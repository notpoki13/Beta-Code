<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Beta Access</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #172554,
                    #020617 70%
                );

            color: white;
        }

        .container {
            width: 90%;

            max-width: 480px;

            padding: 40px;

            background:
                rgba(
                    15,
                    23,
                    42,
                    0.9
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            border-radius: 24px;

            box-shadow:
                0 25px 80px
                rgba(
                    0,
                    0,
                    0,
                    0.5
                );

            text-align: center;

            backdrop-filter:
                blur(20px);
        }

        .logo {
            width: 75px;

            height: 75px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #6366f1
                );

            font-size: 35px;

            box-shadow:
                0 10px 40px
                rgba(
                    59,
                    130,
                    246,
                    0.4
                );
        }

        h1 {
            margin:
                0 0 10px;

            font-size: 32px;
        }

        .description {
            color: #94a3b8;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .highlight {
            color: #60a5fa;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 15px;

            margin-bottom: 12px;

            border-radius: 12px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            background: #0f172a;

            color: white;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color:
                #3b82f6;

            box-shadow:
                0 0 0 3px
                rgba(
                    59,
                    130,
                    246,
                    0.15
                );
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #6366f1
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s,
                opacity 0.2s;
        }

        button:hover {
            transform:
                translateY(-2px);

            opacity: 0.95;
        }

        button:disabled {
            opacity: 0.5;

            cursor:
                not-allowed;

            transform: none;
        }

        #message {
            margin-top: 20px;

            min-height: 24px;

            font-weight: bold;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        .footer {
            margin-top: 25px;

            color: #64748b;

            font-size: 12px;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        🎟️
    </div>


    <h1>
        Beta Access
    </h1>


    <div class="description">

        To Get an Beta Code Get it From

        <span class="highlight">
            notpoki13
        </span>

    </div>


    <input
        id="username"
        type="text"
        placeholder="Enter your username"
        maxlength="50"
        autocomplete="off"
    >


    <input
        id="code"
        type="text"
        placeholder="Enter your beta code"
        maxlength="12"
        autocomplete="off"
    >


    <button id="redeem">

        Redeem Beta Code

    </button>


    <div id="message"></div>


    <div class="footer">

        Beta Code System

    </div>


</div>


<script>


// ==================================================
// YOUR CLOUDFLARE WORKER URL
// ==================================================

const API_URL =
    "beta-code-api.omarksa938.workers.dev";


// ==================================================
// GET ELEMENTS
// ==================================================

const usernameInput =
    document.getElementById(
        "username"
    );

const codeInput =
    document.getElementById(
        "code"
    );

const redeemButton =
    document.getElementById(
        "redeem"
    );

const message =
    document.getElementById(
        "message"
    );


// ==================================================
// CREATE / GET BROWSER ID
// ==================================================

function getDeviceId() {

    let deviceId =
        localStorage.getItem(
            "betaDeviceId"
        );


    // If this browser doesn't
    // have an ID yet, create one.

    if (!deviceId) {

        deviceId =
            crypto.randomUUID();

        localStorage.setItem(
            "betaDeviceId",
            deviceId
        );

    }


    return deviceId;

}


// ==================================================
// CONVERT CODE TO UPPERCASE
// ==================================================

codeInput.addEventListener(
    "input",
    function () {

        codeInput.value =
            codeInput.value.toUpperCase();

    }
);


// ==================================================
// REDEEM BUTTON
// ==================================================

redeemButton.addEventListener(
    "click",
    async function () {


        const username =
            usernameInput.value.trim();


        const code =
            codeInput.value.trim();


        // ------------------------------------------
        // CLEAR OLD MESSAGE
        // ------------------------------------------

        message.className = "";

        message.textContent = "";


        // ------------------------------------------
        // CHECK INPUT
        // ------------------------------------------

        if (!username) {

            message.className =
                "error";

            message.textContent =
                "❌ Please enter your username.";

            return;

        }


        if (!code) {

            message.className =
                "error";

            message.textContent =
                "❌ Please enter your beta code.";

            return;

        }


        // ------------------------------------------
        // DISABLE BUTTON
        // ------------------------------------------

        redeemButton.disabled =
            true;

        redeemButton.textContent =
            "Redeeming...";


        try {


            // --------------------------------------
            // GET BROWSER ID
            // --------------------------------------

            const deviceId =
                getDeviceId();


            // --------------------------------------
            // SEND REQUEST TO CLOUDFLARE
            // --------------------------------------

            const response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                code:
                                    code,

                                deviceId:
                                    deviceId

                            })

                    }
                );


            // --------------------------------------
            // READ RESPONSE
            // --------------------------------------

            let data;


            try {

                data =
                    await response.json();

            } catch {

                throw new Error(
                    "Invalid server response."
                );

            }


            // --------------------------------------
            // SUCCESS
            // --------------------------------------

            if (
                response.ok &&
                data.success
            ) {

                message.className =
                    "success";

                message.textContent =
                    "✅ " +
                    data.message;

                codeInput.value = "";


            }


            // --------------------------------------
            // ERROR
            // --------------------------------------

            else {

                message.className =
                    "error";

                message.textContent =
                    "❌ " +
                    (
                        data.message ||
                        "Something went wrong."
                    );

            }


        } catch (error) {


            console.error(
                "Redeem error:",
                error
            );


            message.className =
                "error";


            message.textContent =
                "❌ Could not connect to the server.";


        }


        // ------------------------------------------
        // ENABLE BUTTON AGAIN
        // ------------------------------------------

        redeemButton.disabled =
            false;

        redeemButton.textContent =
            "Redeem Beta Code";


    }
);


</script>


</body>

</html>
