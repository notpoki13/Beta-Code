<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Beta Access</title>

    <!-- Cloudflare Turnstile -->
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #171f48,
                    #080b20 70%
                );

            color: white;
        }

        .container {
            width: 100%;
            max-width: 480px;

            margin: 20px;
            padding: 40px;

            background: rgba(20, 25, 48, 0.92);

            border: 1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 24px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.45);

            text-align: center;
        }

        .icon {
            width: 76px;
            height: 76px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #5b82ee,
                    #7354df
                );

            font-size: 38px;

            box-shadow:
                0 10px 30px
                rgba(91, 130, 238, 0.3);
        }

        h1 {
            margin: 0 0 12px;

            font-size: 34px;
        }

        .description {
            margin: 0 0 26px;

            color: #9da5bd;

            font-size: 16px;

            line-height: 1.5;
        }

        .description strong {
            color: #70a0ff;
        }

        input {
            width: 100%;

            padding: 15px;

            margin-bottom: 12px;

            border-radius: 12px;

            border: 1px solid
                rgba(255, 255, 255, 0.13);

            background: #11162b;

            color: white;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #637df0;
        }

        input::placeholder {
            color: #7e869e;
        }

        button {
            width: 100%;

            padding: 15px;

            margin-top: 4px;

            border: 0;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #597fec,
                    #7353df
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.15s,
                opacity 0.15s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .turnstile-container {
            display: flex;

            justify-content: center;

            margin: 18px 0;
        }

        #message {
            min-height: 25px;

            margin-top: 22px;

            font-size: 16px;

            font-weight: bold;
        }

        .success {
            color: #55e38b;
        }

        .error {
            color: #ff626f;
        }

        .loading {
            color: #9da5bd;
        }

        .footer {
            margin-top: 28px;

            color: #707993;

            font-size: 13px;
        }

        @media (max-width: 520px) {

            .container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            🎟️
        </div>

        <h1>
            Beta Access
        </h1>

        <p class="description">
            To Get an Beta Code Get it From
            <strong>notpoki13</strong>
        </p>


        <!-- Roblox Username -->

        <input
            id="username"
            type="text"
            placeholder="Enter your Roblox username"
            maxlength="50"
            autocomplete="off"
        >


        <!-- Beta Code -->

        <input
            id="code"
            type="text"
            placeholder="Enter your beta code"
            maxlength="50"
            autocomplete="off"
            autocapitalize="characters"
        >


        <!-- Cloudflare Turnstile -->

        <div class="turnstile-container">

            <div
                class="cf-turnstile"
                id="turnstile"
                data-sitekey="0x4AAAAAAESKnGBqrCQqHaVm"
                data-theme="dark"
            ></div>

        </div>


        <!-- Redeem -->

        <button
            id="redeemButton"
            type="button"
        >
            Redeem Beta Code
        </button>


        <!-- Result -->

        <div
            id="message"
            aria-live="polite">
        </div>


        <div class="footer">
            Subliminal Beta Code System
        </div>

    </div>


    <script>

        // =========================================
        // CLOUDFLARE WORKER URL
        // =========================================

        const API_URL =
            "https://beta-code-api.omarksa938.workers.dev";


        // =========================================
        // ELEMENTS
        // =========================================

        const usernameInput =
            document.getElementById("username");

        const codeInput =
            document.getElementById("code");

        const redeemButton =
            document.getElementById("redeemButton");

        const message =
            document.getElementById("message");


        // =========================================
        // DEVICE ID
        //
        // This ID is stored locally in the browser.
        // It is NOT a secret.
        // =========================================

        function getDeviceId() {

            const storageKey =
                "subliminal_beta_device_id";

            let deviceId =
                localStorage.getItem(storageKey);


            if (!deviceId) {

                if (
                    window.crypto &&
                    crypto.randomUUID
                ) {

                    deviceId =
                        crypto.randomUUID();

                } else {

                    deviceId =
                        Date.now().toString(36) +
                        Math.random()
                            .toString(36)
                            .substring(2);
                }


                localStorage.setItem(
                    storageKey,
                    deviceId
                );
            }


            return deviceId;
        }


        // =========================================
        // MESSAGE
        // =========================================

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                type || "";
        }


        // =========================================
        // GET TURNSTILE TOKEN
        // =========================================

        function getTurnstileToken() {

            if (
                typeof turnstile ===
                "undefined"
            ) {

                return "";
            }


            return turnstile.getResponse();
        }


        // =========================================
        // REDEEM
        // =========================================

        redeemButton.addEventListener(
            "click",
            async function () {

                const username =
                    usernameInput.value.trim();

                const code =
                    codeInput.value
                        .trim()
                        .toUpperCase();


                // ---------------------------------
                // BASIC VALIDATION
                // ---------------------------------

                if (!username) {

                    showMessage(
                        "Please enter your Roblox username.",
                        "error"
                    );

                    return;
                }


                if (!code) {

                    showMessage(
                        "Please enter your beta code.",
                        "error"
                    );

                    return;
                }


                // ---------------------------------
                // TURNSTILE
                // ---------------------------------

                const turnstileToken =
                    getTurnstileToken();


                if (!turnstileToken) {

                    showMessage(
                        "Please complete the security check.",
                        "error"
                    );

                    return;
                }


                // ---------------------------------
                // DISABLE BUTTON
                // ---------------------------------

                redeemButton.disabled =
                    true;

                redeemButton.textContent =
                    "Checking...";


                showMessage(
                    "Checking your beta code...",
                    "loading"
                );


                try {

                    // =============================
                    // SEND TO WORKER
                    // =============================

                    const response =
                        await fetch(
                            API_URL,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        username:
                                            username,

                                        code:
                                            code,

                                        deviceId:
                                            getDeviceId(),

                                        turnstileToken:
                                            turnstileToken
                                    })
                            }
                        );


                    // =============================
                    // READ RESPONSE
                    // =============================

                    let result;


                    try {

                        result =
                            await response.json();

                    } catch {

                        result = {
                            success: false,
                            message:
                                "Server error."
                        };
                    }


                    // =============================
                    // SUCCESS
                    // =============================

                    if (
                        response.ok &&
                        result.success
                    ) {

                        showMessage(
                            result.message ||
                            "Beta code redeemed successfully!",
                            "success"
                        );


                        // Clear inputs

                        codeInput.value =
                            "";


                        // Reset Turnstile

                        if (
                            typeof turnstile !==
                            "undefined"
                        ) {

                            turnstile.reset();
                        }


                        return;
                    }


                    // =============================
                    // ERROR
                    // =============================

                    showMessage(
                        result.message ||
                        "You cannot use this code.",
                        "error"
                    );


                    // Reset Turnstile

                    if (
                        typeof turnstile !==
                        "undefined"
                    ) {

                        turnstile.reset();
                    }


                } catch (error) {

                    console.error(
                        "Redeem error:",
                        error
                    );


                    showMessage(
                        "Could not connect to the server.",
                        "error"
                    );


                    if (
                        typeof turnstile !==
                        "undefined"
                    ) {

                        turnstile.reset();
                    }

                } finally {

                    // =============================
                    // ENABLE BUTTON
                    // =============================

                    redeemButton.disabled =
                        false;

                    redeemButton.textContent =
                        "Redeem Beta Code";
                }

            }
        );


        // =========================================
        // ENTER KEY
        // =========================================

        codeInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    redeemButton.click();
                }

            }
        );


        usernameInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    redeemButton.click();
                }

            }
        );

    </script>

</body>
</html>
