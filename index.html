<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Beta Access</title>

    <!-- Cloudflare Turnstile -->
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #1b2450 0%,
                    #0b0f25 65%,
                    #050718 100%
                );

            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 480px;

            padding: 40px;

            background:
                rgba(18, 24, 48, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 24px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.5);

            text-align: center;
        }

        .icon {
            width: 76px;
            height: 76px;

            margin:
                0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #5f84ef,
                    #7354df
                );

            font-size: 38px;

            box-shadow:
                0 12px 35px
                rgba(91, 126, 239, 0.3);
        }

        h1 {
            margin:
                0 0 12px;

            font-size: 34px;
            font-weight: 700;
        }

        .description {
            margin:
                0 0 26px;

            color: #9da6c0;

            font-size: 16px;

            line-height: 1.5;
        }

        .description strong {
            color: #70a0ff;
        }

        .input {
            width: 100%;

            height: 52px;

            padding:
                0 16px;

            margin-bottom: 12px;

            border:
                1px solid
                rgba(255, 255, 255, 0.13);

            border-radius: 12px;

            outline: none;

            background:
                #11162b;

            color: #ffffff;

            font-size: 16px;

            transition:
                border-color 0.15s,
                box-shadow 0.15s;
        }

        .input:focus {
            border-color: #637df0;

            box-shadow:
                0 0 0 3px
                rgba(99, 125, 240, 0.12);
        }

        .input::placeholder {
            color: #788199;
        }

        .turnstile-box {
            width: 100%;

            min-height: 70px;

            margin:
                18px 0;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            z-index: 1;
        }

        #turnstile-widget {
            min-height: 65px;
        }

        .redeem-button {
            position: relative;

            z-index: 10;

            display: block;

            width: 100%;

            min-height: 52px;

            padding:
                0 16px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #597fec,
                    #7353df
                );

            color: #ffffff;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            user-select: none;

            transition:
                transform 0.15s,
                opacity 0.15s,
                filter 0.15s;
        }

        .redeem-button:hover {
            filter: brightness(1.08);

            transform:
                translateY(-1px);
        }

        .redeem-button:active {
            transform:
                translateY(0);
        }

        .redeem-button:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

            filter: none;
        }

        #message {
            min-height: 25px;

            margin-top: 22px;

            font-size: 16px;

            font-weight: 700;

            line-height: 1.4;
        }

        .success {
            color: #55e38b;
        }

        .error {
            color: #ff626f;
        }

        .loading {
            color: #9da6c0;
        }

        .footer {
            margin-top: 28px;

            color: #707a95;

            font-size: 13px;
        }

        @media (max-width: 520px) {

            body {
                padding: 12px;
            }

            .container {
                padding: 30px 22px;

                border-radius: 20px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="icon">
            🎟️
        </div>

        <h1>
            Beta Access
        </h1>

        <p class="description">
            To Get an Beta Code Get it From
            <strong>notpoki13</strong>
        </p>


        <!-- Roblox Username -->

        <input
            class="input"
            id="username"
            type="text"
            placeholder="Enter your Roblox username"
            maxlength="50"
            autocomplete="off"
            spellcheck="false"
        >


        <!-- Beta Code -->

        <input
            class="input"
            id="code"
            type="text"
            placeholder="Enter your beta code"
            maxlength="50"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
        >


        <!-- Cloudflare Turnstile -->

        <div class="turnstile-box">

            <div id="turnstile-widget"></div>

        </div>


        <!-- Redeem Button -->

        <button
            class="redeem-button"
            id="redeemButton"
            type="button"
        >
            Redeem Beta Code
        </button>


        <!-- Result Message -->

        <div
            id="message"
            aria-live="polite">
        </div>


        <div class="footer">
            Subliminal Beta Code System
        </div>

    </main>


    <script>

        // =====================================================
        // CONFIGURATION
        // =====================================================

        const API_URL =
            "https://beta-code-api.omarksa938.workers.dev";


        // =====================================================
        // TURNSTILE SITE KEY
        //
        // ONLY PUT YOUR SITE KEY HERE.
        //
        // DO NOT PUT YOUR SECRET KEY HERE.
        // =====================================================

        const TURNSTILE_SITE_KEY =
            "0x4AAAAAAESKnGBqrCQqHaVm";


        // =====================================================
        // ELEMENTS
        // =====================================================

        const usernameInput =
            document.getElementById(
                "username"
            );

        const codeInput =
            document.getElementById(
                "code"
            );

        const redeemButton =
            document.getElementById(
                "redeemButton"
            );

        const message =
            document.getElementById(
                "message"
            );


        // =====================================================
        // TURNSTILE TOKEN
        // =====================================================

        let turnstileToken = "";


        // =====================================================
        // DEVICE ID
        // =====================================================

        function getDeviceId() {

            const storageKey =
                "subliminal_beta_device_id";

            let deviceId =
                localStorage.getItem(
                    storageKey
                );


            if (!deviceId) {

                if (
                    window.crypto &&
                    typeof crypto.randomUUID ===
                        "function"
                ) {

                    deviceId =
                        crypto.randomUUID();

                } else {

                    deviceId =
                        Date.now()
                            .toString(36) +
                        "-" +
                        Math.random()
                            .toString(36)
                            .substring(2) +
                        "-" +
                        Math.random()
                            .toString(36)
                            .substring(2);
                }


                localStorage.setItem(
                    storageKey,
                    deviceId
                );
            }


            return deviceId;
        }


        // =====================================================
        // MESSAGE
        // =====================================================

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                type || "";
        }


        // =====================================================
        // TURNSTILE CALLBACK
        // =====================================================

        function onTurnstileSuccess(
            token
        ) {

            turnstileToken =
                token;
        }


        // =====================================================
        // TURNSTILE EXPIRED
        // =====================================================

        function onTurnstileExpired() {

            turnstileToken =
                "";

            showMessage(
                "Please complete the security check again.",
                "error"
            );
        }


        // =====================================================
        // TURNSTILE ERROR
        // =====================================================

        function onTurnstileError() {

            turnstileToken =
                "";

            showMessage(
                "Security check failed. Please try again.",
                "error"
            );
        }


        // =====================================================
        // RENDER TURNSTILE
        // =====================================================

        function setupTurnstile() {

            if (
                TURNSTILE_SITE_KEY ===
                "PASTE_YOUR_TURNSTILE_SITE_KEY_HERE"
            ) {

                showMessage(
                    "Turnstile Site Key has not been configured.",
                    "error"
                );

                return;
            }


            if (
                typeof turnstile ===
                "undefined"
            ) {

                setTimeout(
                    setupTurnstile,
                    500
                );

                return;
            }


            try {

                turnstile.render(
                    "#turnstile-widget",
                    {
                        sitekey:
                            TURNSTILE_SITE_KEY,

                        theme:
                            "dark",

                        callback:
                            onTurnstileSuccess,

                        "expired-callback":
                            onTurnstileExpired,

                        "error-callback":
                            onTurnstileError
                    }
                );

            } catch (error) {

                console.error(
                    "Turnstile error:",
                    error
                );

                showMessage(
                    "Security check could not load.",
                    "error"
                );
            }
        }


        // =====================================================
        // RESET TURNSTILE
        // =====================================================

        function resetTurnstile() {

            turnstileToken =
                "";

            if (
                typeof turnstile !==
                "undefined"
            ) {

                try {

                    turnstile.reset();

                } catch (error) {

                    console.error(
                        "Turnstile reset error:",
                        error
                    );
                }
            }
        }


        // =====================================================
        // REDEEM
        // =====================================================

        redeemButton.addEventListener(
            "click",
            async function () {

                const username =
                    usernameInput.value
                        .trim();

                const code =
                    codeInput.value
                        .trim()
                        .toUpperCase();


                // -----------------------------------------
                // USERNAME
                // -----------------------------------------

                if (!username) {

                    showMessage(
                        "Please enter your Roblox username.",
                        "error"
                    );

                    usernameInput.focus();

                    return;
                }


                // -----------------------------------------
                // CODE
                // -----------------------------------------

                if (!code) {

                    showMessage(
                        "Please enter your beta code.",
                        "error"
                    );

                    codeInput.focus();

                    return;
                }


                // -----------------------------------------
                // TURNSTILE
                // -----------------------------------------

                if (!turnstileToken) {

                    showMessage(
                        "Please complete the security check.",
                        "error"
                    );

                    return;
                }


                // -----------------------------------------
                // DISABLE BUTTON
                // -----------------------------------------

                redeemButton.disabled =
                    true;

                redeemButton.textContent =
                    "Checking...";


                showMessage(
                    "Checking your beta code...",
                    "loading"
                );


                try {

                    // =====================================
                    // SEND REQUEST
                    // =====================================

                    const response =
                        await fetch(
                            API_URL,
                            {
                                method:
                                    "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        username:
                                            username,

                                        code:
                                            code,

                                        deviceId:
                                            getDeviceId(),

                                        turnstileToken:
                                            turnstileToken

                                    })
                            }
                        );


                    // =====================================
                    // READ SERVER RESPONSE
                    // =====================================

                    let result;


                    try {

                        result =
                            await response.json();

                    } catch {

                        result = {
                            success:
                                false,

                            message:
                                "Server error."
                        };
                    }


                    // =====================================
                    // SUCCESS
                    // =====================================

                    if (
                        response.ok &&
                        result.success ===
                            true
                    ) {

                        showMessage(
                            result.message ||
                            "Beta code redeemed successfully!",
                            "success"
                        );


                        codeInput.value =
                            "";


                        resetTurnstile();


                        return;
                    }


                    // =====================================
                    // FAILURE
                    // =====================================

                    showMessage(
                        result.message ||
                        "You cannot use this code.",
                        "error"
                    );


                    resetTurnstile();


                } catch (error) {

                    console.error(
                        "Connection error:",
                        error
                    );


                    showMessage(
                        "Could not connect to the server.",
                        "error"
                    );


                    resetTurnstile();


                } finally {

                    // =====================================
                    // ENABLE BUTTON AGAIN
                    // =====================================

                    redeemButton.disabled =
                        false;

                    redeemButton.textContent =
                        "Redeem Beta Code";
                }

            }
        );


        // =====================================================
        // ENTER KEY
        // =====================================================

        usernameInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    redeemButton.click();
                }
            }
        );


        codeInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    redeemButton.click();
                }
            }
        );


        // =====================================================
        // START TURNSTILE
        // =====================================================

        window.addEventListener(
            "load",
            function () {

                setupTurnstile();

            }
        );

    </script>

</body>
</html>
